# v42: exactly the v41 recipe (same architecture/hyperparams, same group500_taxa_v41.npy 500-
# species focal group - reused unchanged, all 500 confirmed to still have qualifying obs under
# the new filter, so this is a single-variable comparison against v41), but trained on
# train_5007_clean_matched_v2 instead of v41's train_5007_clean_matched.
#
# v41 was killed at epoch004/30 (2026-09-20) after visualize_combined.py showed 6 of the 7
# classic focal species stuck near-zero mean pred while the same species had converged within
# 1 epoch in v40 - investigation ruled out architecture/hyperparams/
# oversampling as the cause, but surfaced a real, separate data-quality issue: the source
# clean_matched build (preprocess_training_data_v3.py, default --exclude_captive) only drops
# rows with captive explicitly true - it kept ~20-30 wild-continent-mismatch records per
# affected species (e.g. Millipede/taxon 47737 had points in India, Brazil, Indonesia) because
# their `captive` field was 0/false in the source export. All had `community=0` too (not yet
# reached community/research-grade ID consensus) - a field the pipeline never filtered on.
# Volume was tiny (~0.1-0.15% per species) and NOT the actual cause of the epoch004 convergence
# problem (that was traced separately to the shared-backbone/independent-head logits both going
# negative on the 5 low-oversample-factor species - likely stochastic, expected to self-correct
# via --pos_weight_adapt) - but real and worth fixing at the source regardless.
#
# Fix: added --require_community to preprocess_training_data_v3.py (drops rows where community
# isn't truthy, unlike --exclude_captive's keep-on-missing default - here missing/blank IS the
# condition being filtered on). Rebuilt on the server against the same production export
# (vision-export-20260906100011-aka-2.35), trimmed to the same 5,007-taxa set via
# trim_to_exact_taxa.py -> train_5007_clean_matched_v2. This is a materially stricter filter:
# -28% of all background observations (321.0M -> 230.6M) though only <1% of taxa (177,564 ->
# 176,004) lost entirely. Hits rare species harder than common ones (expected: fewer
# confirmers) - Amorph -45.6% (2,050->1,116), Ant -33.5% (218->145), vs. -3% to -8% for the 5
# well-sampled classics. Verified zero points outside each of the 7 classic species' own
# original (train_5007) bounding box post-fix (was non-zero for Pika/Millipede/Amorph before).
#
# Decision: comfortable trading data volume for cleanliness given already scale-limited by
# rarity, not by point count - go with the stricter filter as the new default going forward.
#
#   python train_tf_sinr_test.py --config_file focal_10k_config_v42.yml \
#     --train_npy train_5007_clean_matched_v2 --bg_sampling target_group \
#     --bg_tg_fraction 0.65 --num_epochs 30 \
#     --focal_taxa <same 500 taxon_ids as v41 - group500_taxa_v41.npy, comma-join via
#       `python3 -c "import numpy as np; print(','.join(str(t) for t in np.load('group500_taxa_v41.npy')))"` > \
#     --pos_weight 2.25 --independent_head_dim 16 --bg_base_weight 1.5 \
#     --range_penalty_scale 3.0 --oversample_target_exponent 1.0 --oversample_max 20 \
#     --grad_clip_value 1.0 --no_wandb \
#     --pos_weight_adapt --pos_weight_adapt_every 3 --pos_weight_adapt_threshold 0.05 \
#     --pos_weight_adapt_factor 2.0 --pos_weight_adapt_max 50.0
#
# EVALUATE: same protocol as v33-v41 - full 500-group stuck/partial/converged breakdown at every
# adaptation check. Also worth specifically re-checking whether the 7 classic species converge
# within the first 1-3 epochs like v40 (not v41's epoch004 near-zero stall) now that the data
# powering them is cleaner - if they still stall, that's stronger evidence the v41 stall really
# was stochastic/architecture-driven rather than data-driven.
#
dataset_type: "sinr"
sinr_dataset:
    train_data: "pika.csv"
inat_dataset:
    spatial_data: ""
    taxonomy: ""

sampling:
    discretized_sampling: False
    h3_resolution: 4

inputs:
    covariates: "env"
    loc_feat_encoding: "sinusoidal_hd"

elev_data: "elev_scaled.npy"
bioclim_data: "bioclim_coast_effort_landmask_interact_scaled.npy"

initial_lr: 0.0005
lr_decay: 0.93
num_epochs: 30
batch_size: 512
hard_cap: -1
subsample_each_epoch: False
model_save_name: "focal_10k_model_v42.keras"
shuffle_buffer_size: 500000
hidden_dim: 512
effort_scale: 5.0

sinr_hyperparams:
    pos_weight: 2.25
