# IMPORTANT: focal species (Pika, Millipede, Lily, Crab, Lewisia, Amorph, Ant) will train flat
# (~0.5 predictions everywhere) at this scale unless launched with focal oversampling and
# target-group background sampling. Without these, each focal species' presence points get
# drowned out by thousands of competing background species. Train with:
#
#   python train_tf_sinr_test.py --config_file focal_10k_config_v11.yml \
#     --train_npy train_10k_focal_clean --bg_sampling target_group \
#     --bg_tg_fraction 0.65 --num_epochs 20 \
#     --focal_taxa 43188,47360,47737,51315,54952,57358,472214 \
#     --pos_weight 2.25 --focal_oversample 5 --range_penalty_scale 3.0 --no_wandb
#
# (v1-v6: see focal_10k_config_v6.yml. v7/v8: see focal_10k_config_v8.yml. v9/v10: see
# focal_10k_config_v10.yml - v10 is the accepted baseline: clipnorm=1.0 + range_penalty_scale=3.0/
# cap=5.0 gives a smooth, non-oscillating loss curve and clean results for 6/7 species, Ant
# remains the weak point (p10=0.391).)
#
# v11 vs v10: v10 is the accepted baseline. Two small, targeted nudges requested on top of it,
# NOT a redesign - deliberately NOT touching clipnorm, range_penalty_scale/cap, or bg_tg_fraction,
# since those are the parts of the foundation that took several iterations to stabilize:
#   - pos_weight 2.0->2.25 (~12% increase): penalize low predicted intensity at real presence
#     points slightly more (reduce false absences).
#   - effort_scale 6.0->7.0 (~17% increase): penalize high predicted intensity slightly more in
#     cells with real observation effort of OTHER species but no observation of the focal
#     species (reduce false presences in well-sampled-but-absent areas).
# Both are existing, already-proven levers (this is what v7 already tuned once, before the range
# penalty existed) rather than a new mechanism, and the changes are modest by design to avoid
# reopening the instability that came from combining large simultaneous changes in v8/v9.
#
dataset_type: "sinr"
sinr_dataset:
    train_data: "pika.csv"
inat_dataset:
    spatial_data: ""
    taxonomy: ""

sampling:
    discretized_sampling: False
    h3_resolution: 4

inputs:
    covariates: "env"
    loc_feat_encoding: "sinusoidal_hd"

elev_data: "elev_scaled.npy"
bioclim_data: "bioclim_coast_effort_landmask_interact_scaled.npy"

initial_lr: 0.0005
lr_decay: 0.93
num_epochs: 20
batch_size: 512
hard_cap: -1
subsample_each_epoch: False
model_save_name: "focal_10k_model_v11.keras"
shuffle_buffer_size: 500000
hidden_dim: 512
effort_scale: 7.0

sinr_hyperparams:
    pos_weight: 2.25
