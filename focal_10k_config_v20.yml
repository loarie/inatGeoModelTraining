# IMPORTANT: focal species (Pika, Millipede, Lily, Crab, Lewisia, Amorph, Ant) will train flat
# (~0.5 predictions everywhere) at this scale unless launched with focal oversampling and
# target-group background sampling. Without these, each focal species' presence points get
# drowned out by thousands of competing background species. Train with:
#
#   python train_tf_sinr_test.py --config_file focal_10k_config_v20.yml \
#     --train_npy train_10k_focal_clean --bg_sampling target_group \
#     --bg_tg_fraction 0.65 --num_epochs 20 \
#     --focal_taxa 43188,47360,47737,51315,54952,57358,472214 \
#     --pos_weight 2.25 --focal_oversample 5 --range_penalty_scale 3.0 --no_wandb
#
# EVALUATE WITH BOTH: visualize_combined.py (sensitivity) AND check_specificity.py
# (specificity/false-positive rate at 3000+-obs true-absence cells).
#
# v19 = v18 + effort_scale 3.0->5.0 AND hard_neg_scale 0->2.0 (both at once). Result: mixed,
# not a clean win - Millipede/Amorph/Ant specificity improved meaningfully (Amorph/Ant now near
# v11), but Crab and Lewisia got WORSE than v18 (Crab 0.923->0.779, Lewisia 0.860->0.801).
# Averaged across species, roughly a wash vs v18 - just redistributed which species have the
# problem. Since two levers changed simultaneously, can't tell which caused the Crab/Lewisia
# regression vs which caused the Millipede/Amorph/Ant improvement.
#
# v20 vs v18/v19: ABLATION - effort_scale ONLY (3.0->5.0), hard_neg_scale left at 0 (disabled).
# Isolates whether the effort_scale increase alone is responsible for the v19 regressions
# (Crab/Lewisia) and/or improvements (Millipede/Amorph/Ant). Companion run v21 isolates
# hard_neg_scale alone (effort_scale back to 3.0) for direct comparison. Prior signal worth
# noting: hard-negative mining specifically caused a severe temporary Lewisia collapse in v13
# (epoch 4, recovered by epoch 7) - a documented history of destabilizing that species
# specifically, making it a plausible (not yet confirmed) culprit for the Lewisia regression in
# v19. pos_weight/range_penalty_scale/clipnorm unchanged from v18/v19.
#
dataset_type: "sinr"
sinr_dataset:
    train_data: "pika.csv"
inat_dataset:
    spatial_data: ""
    taxonomy: ""

sampling:
    discretized_sampling: False
    h3_resolution: 4

inputs:
    covariates: "env"
    loc_feat_encoding: "sinusoidal_hd"

elev_data: "elev_scaled.npy"
bioclim_data: "bioclim_coast_effort_landmask_interact_scaled.npy"

initial_lr: 0.0005
lr_decay: 0.93
num_epochs: 20
batch_size: 512
hard_cap: -1
subsample_each_epoch: False
model_save_name: "focal_10k_model_v20.keras"
shuffle_buffer_size: 500000
hidden_dim: 512
effort_scale: 5.0

sinr_hyperparams:
    pos_weight: 2.25
