# IMPORTANT: focal species (Pika, Millipede, Lily, Crab, Lewisia, Amorph, Ant) will train flat
# (~0.5 predictions everywhere) at this scale unless launched with focal oversampling and
# target-group background sampling. Without these, each focal species' presence points get
# drowned out by thousands of competing background species. Train with:
#
#   python train_tf_sinr_test.py --config_file focal_10k_config_v3.yml \
#     --train_npy train_10k_focal --bg_sampling target_group \
#     --bg_tg_fraction 0.5 --num_epochs 20 \
#     --focal_taxa 43188,47360,47737,51315,54952,57358,472214 \
#     --pos_weight 1.5 --focal_oversample 5 --no_wandb
#
# v3 vs v2: bumped hidden_dim 256->512 (10K classes were outstripping the shared trunk's
# capacity, causing loss to bounce/drift upward after ~epoch 11 instead of converging) and
# decayed LR faster (lr_decay 0.98->0.93) so the optimizer settles into a minimum instead of
# wandering around one. See focal_10k_model_v2 loss history: bottomed at epoch 4 (1.0448),
# drifted to 1.115 by epoch 30.
#
dataset_type: "sinr"
sinr_dataset:
    train_data: "pika.csv"
inat_dataset:
    spatial_data: ""
    taxonomy: ""

sampling:
    discretized_sampling: False
    h3_resolution: 4

inputs:
    covariates: "env"
    loc_feat_encoding: "sinusoidal_hd"

elev_data: "elev_scaled.npy"
bioclim_data: "bioclim_coast_effort_scaled.npy"

initial_lr: 0.0005
lr_decay: 0.93
num_epochs: 20
batch_size: 512
hard_cap: -1
subsample_each_epoch: False
model_save_name: "focal_10k_model_v3.keras"
shuffle_buffer_size: 500000
hidden_dim: 512
effort_scale: 4.0

sinr_hyperparams:
    pos_weight: 1.5
